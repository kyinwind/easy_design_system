name: easy_design_system
description: "A semantic design system for Flutter: design tokens, Easy API, adaptive layout and fine-grained components. Flutter port of the Swift EasyDesignSystem package."
version: 0.2.0
license: MIT
repository: https://github.com/kyinwind/easy_design_system
issue_tracker: https://github.com/kyinwind/easy_design_system/issues

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/eds_default_theme.json
