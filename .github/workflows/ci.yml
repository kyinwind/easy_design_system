name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format ColorScheme 2.0 branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/colorscheme-2'
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: format semantic component tone APIs"
            git push origin HEAD:feature/colorscheme-2
          fi
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
