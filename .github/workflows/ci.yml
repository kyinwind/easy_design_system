name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Temporary diagnostic mode for the ColorScheme 2.0 draft branch.
      # Restore strict --set-exit-if-changed before merge.
      - name: Format and show patch
        run: |
          dart format .
          git diff -- .
      - run: flutter analyze
      - run: flutter test
