name: Finalize 0.3.1 Format

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-031-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format .
      - name: Commit final format and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize_031_format.yml
          git add .
          git commit -m "style: finalize 0.3.1 dart format"
          git push
